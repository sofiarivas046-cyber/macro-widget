name: Actualizar Indicadores Diarios

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests tzdata

      - name: Ejecutar script de actualización
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_TOKEN: ${{ secrets.BCCH_TOKEN }}
        run: python actualizar.py

      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add indicadores.json
          git commit -m "Actualización automática de indicadores" || exit 0
          git push
