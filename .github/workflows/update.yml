name: Actualizar Indicadores Diarios

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 08:30 AM hora de Chile (11:30 UTC)
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Este botón te permite forzar la actualización cuando tú quieras

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests

      - name: Ejecutar script
        run: python actualizar.py

      - name: Guardar cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add indicadores.json
          git commit -m "Actualizacion automatica diaria" || exit 0
          git push
